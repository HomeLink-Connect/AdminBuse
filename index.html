:root{--navy:#0b1f4d;--navy2:#13306f;--navy3:#1a3a7a;--gold:#f2b705;--bg:#f3f5fb;--card:#fff;--line:#e3e8f4;--text:#161c33;--muted:#6b7390;--ok:#15803d;--okbg:#e8f8ee;--warn:#b45309;--warnbg:#fff4dc;--bad:#c62828;--badbg:#fdecec;--info:#1d4ed8;--infobg:#e8f0ff;--r:16px;--sh:0 1px 2px rgba(11,31,77,.06),0 8px 24px rgba(11,31,77,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.i.sm{width:15px;height:15px}.i.lg{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid transparent;border-radius:11px;padding:9px 15px;font-weight:600;font-size:13px;cursor:pointer;background:var(--navy3);color:#fff;transition:.15s;min-height:38px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}.btn.ghost:hover{background:var(--bg)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gold{background:var(--gold);color:#1a1400}.btn.sm{padding:6px 11px;min-height:32px;font-size:12.5px}
.btn.icon{padding:0;width:38px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}
.badge .i{width:13px;height:13px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
h1,h2,h3{font-family:Georgia,"Playfair Display",serif;color:var(--navy)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% 10%,rgba(242,183,5,.16),transparent 60%),linear-gradient(165deg,var(--navy),var(--navy3) 60%,var(--navy))}
.lbox{background:#fff;border-radius:24px;padding:36px 32px;width:min(420px,100%);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.lbox img{display:block;height:74px;margin:0 auto 12px}.lbox h1{text-align:center;font-size:24px}.lbox p.sub{text-align:center;color:var(--muted);margin:4px 0 20px}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px}
.inp{position:relative}.inp>.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.inp input,.inp select,.inp textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px 11px 40px;background:#fff;outline:none;min-height:44px}
.inp textarea{padding-left:13px;resize:vertical}
.inp input:focus,.inp select:focus,.inp textarea:focus{border-color:var(--navy3);box-shadow:0 0 0 4px rgba(26,58,122,.12)}
.err{background:var(--badbg);color:var(--bad);border-radius:11px;padding:10px 13px;margin-bottom:14px;font-size:13px;display:none}.err.show{display:block}
/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),#08163a);color:#cfd8f2;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;color:#fff}.brand img{height:40px}.brand b{font-family:Georgia,serif;font-size:19px;display:block;line-height:1}.brand small{font-size:11px;color:#8fa0cf;letter-spacing:.4px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#cfd8f2;text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left;position:relative}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--gold);color:#1a1400;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px}.nav.on .cnt{background:#1a1400}
.sp{flex:1}.me{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px;font-size:12px}.me b{display:block;color:#fff;font-size:12.5px;word-break:break-all}
.main{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:20px}.top .menu{display:none}
.content{padding:24px 26px 60px;max-width:1280px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat .ic{width:38px;height:38px;border-radius:11px;background:var(--infobg);color:var(--info);display:grid;place-items:center;margin-bottom:10px}
.stat.warn .ic{background:var(--warnbg);color:var(--warn)}.stat.ok .ic{background:var(--okbg);color:var(--ok)}.stat.bad .ic{background:var(--badbg);color:var(--bad)}
.stat b{font-size:26px;font-family:Georgia,serif;color:var(--navy);display:block;line-height:1.1}.stat span{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs{display:flex;gap:6px;background:#e9edf8;border-radius:13px;padding:4px;margin-bottom:16px;overflow:auto;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}.tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.tabs .n{margin-left:6px;background:var(--bg);border-radius:99px;font-size:11px;padding:1px 7px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar .inp{flex:1;min-width:220px}
.tblw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:12px 14px;background:#fafbff;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbff}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy3);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty .i{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.list>*{border-bottom:1px solid var(--line)}.list>*:last-child{border-bottom:0}.li{display:flex;align-items:center;gap:12px;padding:12px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,16,40,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:f .2s}
@keyframes f{from{opacity:0}}
.md{background:#fff;border-radius:22px;width:min(780px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.md header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.md header h3{font-size:19px}
.md .bd{padding:20px 22px;overflow:auto;flex:1}.md footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fafbff}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{font-weight:600;word-break:break-word}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.docs figure img{width:100%;height:130px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block;background:var(--bg)}.docs figcaption{font-size:12px;font-weight:600;margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:13px}.check input{width:18px;height:18px;accent-color:var(--navy3);margin-top:1px;flex:none}
.sect{margin:18px 0 8px;font:700 13px system-ui;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
.note{display:flex;gap:10px;border-radius:13px;padding:12px 14px;font-size:13px;background:var(--infobg);color:#1a3d9a;margin-bottom:12px}.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:13px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:99;display:flex;gap:8px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.error{background:var(--bad)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.demo{background:var(--gold);color:#1a1400;text-align:center;font-weight:600;padding:6px;font-size:12.5px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.top .menu{display:inline-flex}.grid2{grid-template-columns:1fr}.content{padding:18px 14px 60px}.top{padding:12px 14px}.kv{grid-template-columns:1fr}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);vertical-align:middle}
.tk-th{display:flex;flex-direction:column;gap:10px;max-height:38vh;overflow:auto;padding:4px 2px;margin:8px 0 16px}
.tkb{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;background:#eef1fa;word-break:break-word}
.tkb.u{align-self:flex-start}.tkb.s{align-self:flex-end;background:#d9fdd3}
.tkb small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}.tkb b{font-size:12px;color:var(--navy3)}
</style>

    if (d === 'approved') { await D.update('landlords', id, { verified: true, 'verification.status': 'approved', 'verification.reviewNote': note, 'verification.reviewedAt': now, 'verification.reviewedBy': S.admin }); for (const p of S.data.properties.filter(x => x.landlordId === id)) await D.update('properties', p.id, { verified: true }); await audit('Approved landlord', id, name(l), note); toast(name(l) + ' is now verified.'); }
    else if (d === 'rejected') { await D.update('landlords', id, { verified: false, 'verification.status': 'rejected', 'verification.reviewNote': note, 'verification.reviewedAt': now, 'verification.reviewedBy': S.admin }); await audit('Requested changes', id, name(l), note); toast('Sent back to the landlord.'); }
    else { await D.update('landlords', id, { verified: false, 'verification.status': 'rejected', 'verification.reviewNote': 'Verification was revoked by the Admin Office.', 'verification.reviewedAt': now }); for (const p of S.data.properties.filter(x => x.landlordId === id)) await D.update('properties', p.id, { verified: false }); await audit('Revoked verification', id, name(l), ''); toast('Verification revoked.'); }
    closeModal(); render();
  } catch (e) { console.error(e); toast('Could not save: ' + (e.code === 'permission-denied' ? 'Firestore rules do not allow this admin yet.' : e.message), 'error'); }
}
async function suspend(col, id) {
  const o = S.data[col].find(x => x.id === id); if (!o) return; const to = !o.suspended;
  if (!confirm((to ? 'Suspend ' : 'Restore ') + name(o) + '?' + (to ? ' They will be blocked from logging in to Offrez.' : ''))) return;
  try { await D.update(col, id, { suspended: to }); await audit(to ? 'Suspended account' : 'Restored account', id, name(o), col); toast(to ? 'Account suspended.' : 'Account restored.'); render(); } catch (e) { toast('Could not save: ' + e.message, 'error'); }
}
function csv(key) {
  const T = { t: () => S.data.tickets.map(t => [t.id, t.category, t.subject, t.name, t.role, t.email, t.phone, t.priority, t.status, t.created]), v: () => S.data.landlords.filter(l => l.verification).map(l => [name(l), l.email, l.phone, vstat(l), (l.verification || {}).submittedAt]), l: () => S.data.landlords.map(l => [name(l), l.email, l.phone, l.business, vstat(l), l.suspended ? 'suspended' : 'active', l.joined]), s: () => S.data.students.map(s => [name(s), s.regNumber, s.email, s.phone, s.faculty, s.suspended ? 'suspended' : 'active', s.joined]), p: () => S.data.properties.map(p => [p.title, p.area, p.price, p.status, p.verified, name(L(p.landlordId))]), b: () => S.data.bookings.map(b => [(P(b.propertyId) || {}).title, name(ST(b.studentId)), name(L(b.landlordId)), b.movein, b.status, b.created]), a: () => S.data.auditLog.map(a => [a.at, a.admin, a.action, a.targetName, a.note]) };
  const rows = (T[key] || (() => []))(); const csvText = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csvText], { type: 'text/csv' })); a.download = 'offrez-' + key + '-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); toast('Exported ' + rows.length + ' rows.');
}

/* ============ SUPPORT INBOX (synced with the student and landlord apps) ============ */
const TK_OPEN = t => t.status !== 'Closed' && t.status !== 'Resolved';
const needsAttention = t => TK_OPEN(t) && (t.status === 'Open' || t.adminUnread);
const tkBadge = s => ({ 'Open': '<span class="badge info">' + ic('inbox') + 'Open</span>', 'In review': '<span class="badge warn">' + ic('clock') + 'In review</span>', 'Resolved': '<span class="badge ok">' + ic('check-circle') + 'Resolved</span>', 'Closed': '<span class="badge">' + ic('lock') + 'Closed</span>' }[s] || '<span class="badge">' + esc(s) + '</span>');
const waLink = p => { let d = String(p || '').replace(/\D/g, ''); if (!d) return ''; if (d[0] === '0') d = '263' + d.slice(1); return 'https://wa.me/' + d; };
const CANNED = [
  ['Received, looking into it', 'Thank you for contacting Offrez. We have received your message and are looking into it. We will update you here shortly.'],
  ['Need more details', 'Thank you for reporting this. Could you please share more details (dates, names, and a screenshot if you have one) so we can investigate properly?'],
  ['Report actioned', 'Thank you for your report. Our team has reviewed it and taken the appropriate action. We take the safety of every student seriously.'],
  ['Payment: send receipt', 'Please reply with your payment receipt or reference number and the date you paid, so we can check this with the landlord.'],
  ['Resolved', 'We believe this is now resolved. Please reply here if you still need help and we will reopen your request.'],
  ['Safety reminder', 'For your safety, please never pay before viewing the room in person, and keep all conversations inside Offrez.']
];
V.support = () => {
  const tab = S.tab.t || 'open', all = [...S.data.tickets].sort((a, b) => new Date(b.updated || b.created) - new Date(a.updated || a.created));
  const f = { open: t => t.status === 'Open', review: t => t.status === 'In review', done: t => !TK_OPEN(t) };
  const list = (tab === 'all' ? all : all.filter(f[tab])).filter(t => matchQ('t', t.subject, t.name, t.email, t.category, t.body, t.id));
  return head('Support inbox', 'Complaints, reports and questions from students and landlords. Your replies appear instantly in their app.') +
    tabsHtml('t', [['open', 'New', all.filter(f.open).length], ['review', 'In review', all.filter(f.review).length], ['done', 'Resolved / closed', all.filter(f.done).length], ['all', 'All', all.length]], tab) +
    searchBar('t', 'Search subject, person, category or ID') +
    (list.length ? `<div class="card"><div class="list">${list.map(t => `<div class="li" data-act="ticket" data-id="${esc(t.id)}" style="cursor:pointer"><div class="av">${esc(ini({ fname: (t.name || '?').split(' ')[0], lname: (t.name || '').split(' ')[1] || '' }))}</div><div class="grow" style="min-width:0"><b>${t.adminUnread ? '<span class="dot"></span> ' : ''}${esc(t.subject)}</b> ${t.priority === 'Urgent' ? '<span class="badge bad">' + ic('alert') + 'Urgent</span>' : ''}<div class="tiny muted">${esc(t.name || 'Unknown')} · ${esc(t.role || '')} · ${esc(t.category)} · ${ago(t.updated || t.created)}</div></div>${tkBadge(t.status)}</div>`).join('')}</div></div>` : empty('inbox', tab === 'open' ? 'No new support requests. All caught up!' : 'Nothing here.'));
};
function supportOverviewCard() {
  const list = S.data.tickets.filter(needsAttention).sort((a, b) => new Date(b.updated || b.created) - new Date(a.updated || a.created)).slice(0, 6);
  return `<div class="card" style="margin-top:16px"><div class="row between" style="margin-bottom:6px"><h3>Support requests needing a reply</h3><button class="btn ghost sm" data-act="go" data-p="support">Open inbox</button></div>${list.length ? `<div class="list">${list.map(t => `<div class="li" data-act="ticket" data-id="${esc(t.id)}" style="cursor:pointer"><div class="grow"><b>${esc(t.subject)}</b><div class="tiny muted">${esc(t.name || '')} · ${esc(t.category)} · ${ago(t.updated || t.created)}</div></div>${tkBadge(t.status)}</div>`).join('')}</div>` : empty('check-circle', 'No requests waiting.')}</div>`;
}
const _ov = V.overview; V.overview = () => _ov() + supportOverviewCard();
function tkBubble(isAdmin, who, text, d) { return `<div class="tkb ${isAdmin ? 's' : 'u'}">${isAdmin ? '' : '<b>' + esc(who) + '</b><br>'}${esc(text).replace(/\n/g, '<br>')}<small>${fdt(d)}</small></div>`; }
function openTicket(id) {
  const t = S.data.tickets.find(x => x.id === id); if (!t) return;
  const rel = t.related || null, wa = waLink(t.phone);
  if (t.adminUnread) D.update('tickets', id, { adminUnread: false }).catch(() => { });
  const thread = tkBubble(false, t.name, t.body, t.created) + (t.attachment && /^data:image\//.test(t.attachment) ? `<div class="tkb u"><img src="${t.attachment}" alt="Screenshot" data-act="zoom" style="max-width:100%;border-radius:8px;cursor:zoom-in"></div>` : '') +
    (t.replies || []).map(r => tkBubble(r.from === 'support', r.name || t.name, r.body, r.date)).join('');
  modal(esc(t.subject) + ' ' + tkBadge(t.status), `
    <dl class="kv"><dt>From</dt><dd>${esc(t.name || '—')} <span class="badge">${esc(t.role || '')}</span></dd>
    <dt>Email</dt><dd>${t.email ? `<a href="mailto:${esc(t.email)}">${esc(t.email)}</a>` : '—'}</dd>
    <dt>Phone</dt><dd>${t.phone ? `<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>` : '—'} ${wa ? `<a class="badge ok" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</dd>
    <dt>Category</dt><dd>${esc(t.category)} ${t.priority === 'Urgent' ? '<span class="badge bad">Urgent</span>' : ''}</dd>
    <dt>Reference</dt><dd>${esc(t.id)} · ${fdt(t.created)}</dd>
    ${rel && rel.id ? `<dt>Regarding</dt><dd>${esc(rel.label || rel.id)} <button class="btn ghost sm" data-act="trel" data-type="${esc(rel.type)}" data-rid="${esc(rel.id)}">View</button></dd>` : ''}</dl>
    <div class="sect">Conversation</div><div class="tk-th" id="tkth">${thread}</div>
    <div class="field"><label for="tcanned">Quick reply</label><div class="inp"><select id="tcanned" style="padding-left:13px"><option value="">Choose a saved reply…</option>${CANNED.map((c, i) => `<option value="${i}">${esc(c[0])}</option>`).join('')}</select></div></div>
    <div class="field"><label for="trtext">Your reply</label><div class="inp"><textarea id="trtext" rows="4" placeholder="Write a reply. The person sees it in their Offrez app straight away."></textarea></div></div>`,
    `<button class="btn ghost" style="color:var(--bad);margin-right:auto" data-act="tdel" data-id="${esc(id)}">Delete</button>
     ${TK_OPEN(t) ? `<button class="btn ghost" data-act="tstatus" data-id="${esc(id)}" data-s="Closed">Close</button><button class="btn ok" data-act="treply" data-id="${esc(id)}" data-s="Resolved">${ic('check-circle', 'sm')}Reply &amp; resolve</button>` : `<button class="btn ghost" data-act="tstatus" data-id="${esc(id)}" data-s="Open">Reopen</button>`}
     <button class="btn gold" data-act="treply" data-id="${esc(id)}" data-s="In review">${ic('send', 'sm')}Send reply</button>`);
  const th = $('#tkth'); if (th) th.scrollTop = th.scrollHeight;
}
async function ticketReply(id, status) {
  const t = S.data.tickets.find(x => x.id === id); if (!t) return; const text = (($('#trtext') || {}).value || '').trim(), now = new Date().toISOString();
  if (!text) { toast('Write a reply first.', 'error'); const x = $('#trtext'); if (x) x.focus(); return; }
  try {
    await D.update('tickets', id, { replies: D.union({ from: 'support', name: 'Offrez Support', admin: S.admin, body: text, date: now }), status, updated: now, adminUnread: false, userUnread: true });
    await audit(status === 'Resolved' ? 'Replied and resolved request' : 'Replied to request', id, t.subject, ''); toast(status === 'Resolved' ? 'Reply sent and request resolved.' : 'Reply sent.'); closeModal(); render();
  } catch (e) { console.error(e); toast('Could not send: ' + (e.code === 'permission-denied' ? 'Firestore rules do not allow this admin yet.' : e.message), 'error'); }
}
async function ticketStatus(id, status) {
  const t = S.data.tickets.find(x => x.id === id); if (!t) return;
  try { await D.update('tickets', id, { status, updated: new Date().toISOString(), userUnread: true, adminUnread: false }); await audit('Marked request ' + status, id, t.subject, ''); toast('Marked ' + status.toLowerCase() + '.'); closeModal(); render(); }
  catch (e) { toast('Could not save: ' + e.message, 'error'); }
}
async function ticketDelete(id) {
  const t = S.data.tickets.find(x => x.id === id); if (!t || !confirm('Permanently delete this request? The person will no longer see it.')) return;
  try { await D.del('tickets', id); await audit('Deleted request', id, t.subject, ''); toast('Request deleted.'); closeModal(); render(); } catch (e) { toast('Could not delete: ' + e.message, 'error'); }
}
function ticketRelated(type, id) {
  closeModal();
  if (type === 'property') { const p = P(id); S.page = 'properties'; S.q.p = p ? p.title : ''; }
  else if (L(id)) { reviewLandlord(id); return; }
  else { const s = ST(id); S.page = 'students'; S.q.s = s ? (s.email || name(s)) : ''; }
  render(); window.scrollTo(0, 0);
}
/* new request / new reply alerts */
const _tkSeen = {}; let _tkInit = false;
function ticketAlert() {
  const fresh = []; S.data.tickets.forEach(t => { const n = (t.replies || []).length; if (_tkInit && (!(t.id in _tkSeen) || (n > _tkSeen[t.id] && (t.replies[n - 1] || {}).from === 'user'))) fresh.push(t); _tkSeen[t.id] = n; });
  _tkInit = true;
  if (fresh.length) { toast('Support: ' + (fresh[0].priority === 'Urgent' ? 'URGENT · ' : '') + fresh[0].subject + (fresh.length > 1 ? ' (+' + (fresh.length - 1) + ' more)' : '')); try { const C = window.AudioContext || window.webkitAudioContext, c = new C(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .3); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .3); } catch (e) { } }
  const n = S.data.tickets.filter(needsAttention).length; document.title = (n ? '(' + n + ') ' : '') + 'Offrez Admin';
}
document.addEventListener('change', e => { if (e.target.id === 'tcanned') { const i = e.target.value, t = $('#trtext'); if (i !== '' && t) { t.value = CANNED[+i][1]; t.focus(); } } });

/* ============ EVENTS ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (a === 'go') { S.page = el.dataset.p; $('#side') && $('#side').classList.remove('open'); render(); window.scrollTo(0, 0); }
  else if (a === 'menu') $('#side').classList.toggle('open');
  else if (a === 'tab') { S.tab[el.dataset.key] = el.dataset.t; render(); }
  else if (a === 'review') reviewLandlord(el.dataset.id);
  else if (a === 'ticket') openTicket(el.dataset.id);
  else if (a === 'treply') { el.disabled = true; await ticketReply(el.dataset.id, el.dataset.s); el.disabled = false; }
  else if (a === 'tstatus') { el.disabled = true; await ticketStatus(el.dataset.id, el.dataset.s); el.disabled = false; }
  else if (a === 'tdel') ticketDelete(el.dataset.id);
  else if (a === 'trel') ticketRelated(el.dataset.type, el.dataset.rid);
  else if (a === 'decide') { el.disabled = true; await decide(el.dataset.id, el.dataset.d); el.disabled = false; }
  else if (a === 'suspend') suspend(el.dataset.col, el.dataset.id);
  else if (a === 'pverify') { const p = P(el.dataset.id); await D.update('properties', p.id, { verified: !p.verified }); await audit(p.verified ? 'Unverified property' : 'Verified property', p.id, p.title, ''); render(); }
  else if (a === 'pdel') { const p = P(el.dataset.id); if (confirm('Permanently remove "' + p.title + '"?')) { try { await D.del('properties', p.id); await audit('Removed property', p.id, p.title, ''); toast('Property removed.'); render(); } catch (x) { toast(x.message, 'error'); } } }
  else if (a === 'csv') csv(el.dataset.key);
  else if (a === 'close') closeModal();
  else if (a === 'zoom') { const o = document.createElement('div'); o.className = 'ov'; o.style.zIndex = 60; o.innerHTML = `<img src="${el.src}" alt="" style="max-width:96vw;max-height:92vh;border-radius:14px;cursor:zoom-out">`; o.onclick = () => o.remove(); document.body.appendChild(o); }
  else if (a === 'logout') { await D.logout(); S.admin = null; showLogin(); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.q; if (k) { S.q[k] = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(render, 150); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'lf') return; e.preventDefault();
  const em = $('#le').value.trim(), pw = $('#lp').value, err = $('#lerr'), btn = e.target.querySelector('button'); err.classList.remove('show');
  if (!em || !pw) { err.textContent = 'Enter your email and password.'; err.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Signing in…';
  try { await D.login(em, pw); } catch (x) { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = /network/.test(x.code || '') ? 'No connection. Check your network and try again.' : /too-many/.test(x.code || '') ? 'Too many attempts. Wait a few minutes and try again.' : 'Incorrect email or password.'; err.classList.add('show'); }
});

/* ============ BOOT ============ */
(async function () {
  $('#app').innerHTML = '<div class="login"><div style="color:#fff;text-align:center"><span class="spin" style="width:30px;height:30px"></span><p style="margin-top:12px">Connecting…</p></div></div>';
  try { D = DEMO ? demoLayer() : await cloudLayer(); } catch (e) { $('#app').innerHTML = '<div class="login"><div class="lbox" style="text-align:center"><h1>Cannot connect</h1><p class="sub">Could not reach Firebase. Check your network and reload.</p><button class="btn" onclick="location.reload()">Reload</button></div></div>'; return; }
  D.onUser(u => {
    if (!u) return showLogin();
    S.admin = u.email;
    let denied = false;
    render();
    D.subscribe(c => { if (!denied) { if (c === 'tickets') ticketAlert(); render(); pushStats(); } }, () => { if (!denied) { denied = true; D.logout().catch(() => { }); showDenied(u.email, u.emailVerified === false); } });
  });
})();
</script>
